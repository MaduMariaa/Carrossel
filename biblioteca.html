<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca</title>
    <link rel="stylesheet" href="css/biblioteca.css">
</head>
<body>
    <div class="container">
        <h2>Cadastrar Livro</h2>
        <br>
        <input type="text" placeholder="Título" id="titulo">
        <input type="text" placeholder="Autor" id="autor">
        <input type="text" placeholder="Ano" id="ano">
        <input type="text" placeholder="Gênero" id="genero">

        <button id="btnCadastrar">
            Cadastrar
        </button>
        <br><br>
        <hr>
        <br>
        <h2>Pesquisar Livros</h2>
        <br>
        <input type="text" id="busca" placeholder="Digite o título">
        <br>
        <hr>
        <br>
        <h2>Estante</h2>
        <br>
        <div id="estante">

        </div>
    </div>
    <script src="js/biblioteca.js"></script>
</body>
</html>
